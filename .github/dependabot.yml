# Monthly, grouped, so updates arrive as a few PRs instead of dozens.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ['*']
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directories: [/, /web, /e2e]
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly

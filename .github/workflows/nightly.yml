# Nightly, only if main got commits in the last 24 hours: long invariant run.
# Sundays, only if main got commits in the last 7 days: Stryker mutation testing of the engine.
name: Nightly

on:
  schedule:
    - cron: '0 1 * * *' # 04:00 Moscow: long invariants
    - cron: '0 2 * * 0' # Sunday 05:00 Moscow: mutation testing
  workflow_dispatch:
    inputs:
      job:
        description: What to run
        type: choice
        options: [invariants, mutation]
        default: invariants

concurrency:
  group: nightly-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      invariants: ${{ steps.plan.outputs.invariants }}
      mutation: ${{ steps.plan.outputs.mutation }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.job }}
        run: |
          recent() { [ -n "$(git log origin/main --since="$1" --format=%H -n 1)" ] && echo true || echo false; }
          if [ -n "$MANUAL" ]; then
            [ "$MANUAL" = invariants ] && echo "invariants=true" >> "$GITHUB_OUTPUT"
            [ "$MANUAL" = mutation ] && echo "mutation=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = '0 2 * * 0' ]; then
            echo "mutation=$(recent '7 days ago')" >> "$GITHUB_OUTPUT"
          else
            echo "invariants=$(recent '24 hours ago')" >> "$GITHUB_OUTPUT"
          fi

  invariants:
    needs: plan
    if: needs.plan.outputs.invariants == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Long invariant run
        run: npm run -s test:invariants:long

  mutation:
    needs: plan
    if: needs.plan.outputs.mutation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet tool restore
      - name: Stryker (engine, break below 80%)
        run: npm run -s test:mutation
      - name: Mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker
          path: test-artifacts/stryker
          if-no-files-found: ignore
          retention-days: 30

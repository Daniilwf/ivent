# The live site and the test copy on one server behind Caddy (J1, D-127). Locally the same file brings the site up on
# https://localhost (Caddy's own certificate):
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# The test copy starts only with its profile: add --profile staging.
# Migrations are their own step before the site starts (D-27): the one-off `migrate` service runs them and exits.

name: ivent

x-site: &site
  image: ivent:${VERSION:-local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  networks: [web]
  environment:
    &site-environment # Only Caddy's network may say who the client is (the login limit counts real addresses, D-107)
    Proxy__KnownNetworks__0: 172.28.0.0/16
    Metadata__IgdbClientId: ${IGDB_CLIENT_ID:-}
    Metadata__IgdbClientSecret: ${IGDB_CLIENT_SECRET:-}
    Metadata__HltbSearchUrl: ${HLTB_SEARCH_URL:-}

services:
  migrate:
    <<: *site
    command: ['migrate']
    restart: 'no'
    volumes: [site-data:/data]
    environment:
      <<: *site-environment
      AllowedHosts: ${SITE_DOMAIN:-localhost};localhost

  site:
    <<: *site
    volumes: [site-data:/data]
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      <<: *site-environment
      AllowedHosts: ${SITE_DOMAIN:-localhost};localhost

  staging-migrate:
    <<: *site
    profiles: [staging]
    command: ['migrate']
    restart: 'no'
    volumes: [staging-data:/data]
    environment:
      <<: *site-environment
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${STAGING_DOMAIN:-staging.localhost};localhost

  staging:
    <<: *site
    profiles: [staging]
    volumes: [staging-data:/data]
    depends_on:
      staging-migrate: { condition: service_completed_successfully }
    environment:
      <<: *site-environment
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${STAGING_DOMAIN:-staging.localhost};localhost

  caddy:
    image: caddy:2
    restart: unless-stopped
    networks: [web]
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [site]

networks:
  web:
    ipam:
      config: [{ subnet: 172.28.0.0/16 }]

volumes:
  site-data:
  staging-data:
  caddy-data:
  caddy-config:
